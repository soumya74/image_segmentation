# configs/cityscapes.yaml
path: ../datasets/cityscapes  # dataset root dir (relative to the Colab execution folder)
train: images/train           # train images (relative to 'path')
val: images/val               # val images (relative to 'path')
test: images/test             # test images (optional)

# Note: Ultralytics expects single-channel PNG masks in a matching 'masks/' directory
masks_dir: masks              # directory containing semantic masks

# Classes (Cityscapes 19 evaluation classes)
names:
  0: road
  1: sidewalk
  2: building
  3: wall
  4: fence
  5: pole
  6: traffic light
  7: traffic sign
  8: vegetation
  9: terrain
  10: sky
  11: person
  12: rider
  13: car
  14: truck
  15: bus
  16: train
  17: motorcycle
  18: bicycle